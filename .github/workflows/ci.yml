name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate
        run: claude plugin validate .
      - name: Test
        run: claude plugin test .
      - name: Guardrails
        shell: bash
        run: node scripts/check.mjs ${{ github.base_ref && format('--base origin/{0}', github.base_ref) || '' }}